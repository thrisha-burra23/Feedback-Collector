<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Reset Your Password</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@500;600&display=swap" rel="stylesheet">
  <style>
    body {
      font-family: 'Inter', sans-serif;
      background-color: #f4f6f8;
    }

    .navbar {
      background-color: #ffffff;
      box-shadow: 0 1px 6px rgba(0, 0, 0, 0.05);
    }

    .navbar-brand {
      font-weight: 600;
      font-size: 1.25rem;
      color: #0d6efd;
    }

    .form-container {
      max-width: 500px;
      margin: 0 auto;
      background-color: #ffffff;
      padding: 40px;
      border-radius: 12px;
      box-shadow: 0 0 30px rgba(0,0,0,0.04);
    }

    h2 {
      text-align: center;
      color: #0d6efd;
      margin-bottom: 30px;
      font-weight: 600;
    }

    .btn-success {
      width: 100%;
    }

    .form-text {
      font-size: 0.9rem;
    }

    #responseMessage {
      text-align: center;
    }
  </style>
</head>
<body>
  <nav class="navbar navbar-light mb-4">
    <div class="container">
      <a class="navbar-brand" href="/">📝 FeedbackApp</a>
      <a class="btn btn-outline-primary" href="/login">Login</a>
    </div>
  </nav>

  <div class="container">
    <div class="form-container">
      <h2>🔐 Forgot Password</h2>
      <form id="forgotForm">
        <div class="mb-3">
          <label>Username</label>
          <input type="text" name="username" class="form-control" required />
        </div>

        <div class="mb-3">
          <label>Answer to Recovery Question</label>
          <input type="text" name="recovery_answer" class="form-control" required />
        </div>

        <div class="mb-3">
          <label>New Password</label>
          <input type="password" id="newPassword" name="new_password" class="form-control" required />
          <div class="form-text text-danger" id="strengthError" style="display:none;">
            Password must be at least 8 characters, include uppercase, lowercase, a number, and a special character.
          </div>
        </div>

        <div class="mb-3">
          <label>Confirm New Password</label>
          <input type="password" id="confirmNewPassword" class="form-control" required />
          <div class="form-text text-danger" id="matchError" style="display:none;">
            Passwords do not match.
          </div>
        </div>

        <button type="submit" class="btn btn-success mt-3">Reset Password</button>
      </form>
      <div id="responseMessage" class="mt-3 fw-bold"></div>
    </div>
  </div>

  <script>
    function validateForm() {
      const pass = document.getElementById('newPassword').value;
      const confirm = document.getElementById('confirmNewPassword').value;
      const matchError = document.getElementById('matchError');
      const strengthError = document.getElementById('strengthError');
      const strongRegex = /^(?=.*[a-z])(?=.*[A-Z])(?=.*\d)(?=.*[@$!%*?&#^])[A-Za-z\d@$!%*?&#^]{8,}$/;

      if (!strongRegex.test(pass)) {
        strengthError.style.display = 'block';
        matchError.style.display = 'none';
        return false;
      }

      if (pass !== confirm) {
        matchError.style.display = 'block';
        strengthError.style.display = 'none';
        return false;
      }

      strengthError.style.display = 'none';
      matchError.style.display = 'none';
      return true;
    }

    document.getElementById('forgotForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      if (!validateForm()) return;

      const form = e.target;
      const data = {
        username: form.username.value,
        recovery_answer: form.recovery_answer.value,
        new_password: form.new_password.value
      };

      try {
        const res = await fetch('/forgot-password', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(data)
        });
        const result = await res.json();
        const msgBox = document.getElementById('responseMessage');

        if (result.success) {
          msgBox.className = 'mt-3 text-success fw-bold';
          msgBox.innerText = '✅ Password updated! Redirecting to login...';
          setTimeout(() => window.location.href = '/login', 1500);
        } else {
          msgBox.className = 'mt-3 text-danger fw-bold';
          msgBox.innerText = result.message || 'Recovery failed. Please try again.';
        }
      } catch (error) {
        console.error('❌ Fetch error:', error);
        msgBox.className = 'mt-3 text-danger fw-bold';
        msgBox.innerText = 'Something went wrong. Please try again later.';
      }
    });
  </script>
</body>
</html>
