<!DOCTYPE html>
<html>
<head>
  <title>User Dashboard</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">

<!-- Navbar -->
<nav class="navbar navbar-dark bg-primary px-3">
  <span class="navbar-brand">🎯 FeedbackApp - Dashboard</span>
  <a href="/logout" class="btn btn-outline-light">Logout</a>
</nav>

<div class="container my-5">
  <h2 class="mb-4">Welcome, <span id="userName">User</span> 👋</h2>

  <!-- Feedback Form -->
  <div class="card mb-4 shadow">
    <div class="card-header bg-success text-white">📝 Submit New Feedback</div>
    <div class="card-body">
      <form action="/submit-feedback" method="POST">
        <input type="email" name="email" placeholder="Your email" class="form-control mb-2" required>
        <textarea name="message" placeholder="Your feedback" class="form-control mb-3" required></textarea>
        <button type="submit" class="btn btn-success">Submit</button>
      </form>
    </div>
  </div>

  <!-- Feedback History -->
  <h4 class="mb-3">📂 Your Submitted Feedback</h4>
  <div id="feedbackCards">
    <!-- Cards will be inserted here dynamically -->
  </div>
</div>

<!-- Scripts -->
<script>
  // Set username
  fetch('/get-username')
    .then(res => res.json())
    .then(data => {
      document.getElementById('userName').textContent = data.username;
    });

  // Load feedbacks
  fetch('/api/user-feedbacks')
    .then(res => res.json())
    .then(feedbacks => {
      const container = document.getElementById('feedbackCards');
      container.innerHTML = '';
      feedbacks.forEach(entry => {
        const card = document.createElement('div');
        card.className = 'card mb-3 shadow-sm';
        card.dataset.id = entry.id;
        card.innerHTML = `
          <div class="card-body">
            <p><strong>Message:</strong> <span class="message-text">${entry.message}</span></p>
            <p><strong>Admin Reply:</strong> <span class="text-muted">${entry.admin_reply || 'Awaiting reply'}</span></p>
            <div class="d-flex gap-2">
              <button class="btn btn-sm btn-warning edit-btn">Edit</button>
              <button class="btn btn-sm btn-danger delete-btn">Delete</button>
            </div>
            <form class="edit-form mt-3" style="display: none;" method="POST" action="/edit/${entry.id}">
              <textarea name="message" class="form-control mb-2">${entry.message}</textarea>
              <div class="d-flex gap-2">
                <button type="submit" class="btn btn-sm btn-success">Save</button>
                <button type="button" class="btn btn-sm btn-secondary cancel-btn">Cancel</button>
              </div>
            </form>
          </div>
        `;
        container.appendChild(card);
      });
      activateInlineButtons();
    });

  function activateInlineButtons() {
    document.querySelectorAll('.edit-btn').forEach(button => {
      button.addEventListener('click', () => {
        const card = button.closest('.card');
        card.querySelector('.edit-form').style.display = 'block';
        card.querySelector('.message-text').style.display = 'none';
        button.style.display = 'none';
      });
    });

    document.querySelectorAll('.cancel-btn').forEach(button => {
      button.addEventListener('click', () => {
        const card = button.closest('.card');
        card.querySelector('.edit-form').style.display = 'none';
        card.querySelector('.message-text').style.display = 'inline';
        card.querySelector('.edit-btn').style.display = 'inline-block';
      });
    });

    document.querySelectorAll('.delete-btn').forEach(button => {
      button.addEventListener('click', () => {
        const id = button.closest('.card').dataset.id;
        if (confirm('Are you sure you want to delete this feedback?')) {
          window.location.href = `/delete/${id}`; // You may implement this on the backend
        }
      });
    });
  }
</script>
</body>
</html>
