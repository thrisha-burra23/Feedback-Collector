<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>User Registration</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@500;600&display=swap" rel="stylesheet">
  <style>
    body {
      font-family: 'Inter', sans-serif;
      background-color: #f4f6f8;
    }

    .navbar {
      background-color: #ffffff;
      box-shadow: 0 1px 6px rgba(0, 0, 0, 0.05);
    }

    .navbar-brand {
      font-weight: 600;
      font-size: 1.25rem;
      color: #0d6efd;
    }

    h2 {
      text-align: center;
      color: #0d6efd;
      margin-bottom: 30px;
      font-weight: 600;
    }

    .form-container {
      max-width: 500px;
      margin: 0 auto;
      background-color: #ffffff;
      padding: 40px;
      border-radius: 12px;
      box-shadow: 0 0 30px rgba(0,0,0,0.04);
    }

    .form-label {
      font-weight: 500;
    }

    .btn-success {
      width: 100%;
    }

    #registerMessage {
      text-align: center;
    }

    #strengthError,
    #matchError {
      font-size: 0.9rem;
    }
  </style>
</head>
<body>
  <div class="container py-5">
    <!-- Navbar -->
    <nav class="navbar navbar-light mb-4">
      <div class="container">
        <a class="navbar-brand" href="/">📝 FeedbackApp</a>
        <div>
          <a class="btn btn-outline-primary me-2" href="/login">Login</a>
          <a class="btn btn-outline-success" href="/register">Register</a>
        </div>
      </div>
    </nav>

    <div class="form-container">
      <h2>Register</h2>

      <form id="registerForm">
        <!-- Username -->
        <div class="mb-3">
          <label class="form-label">Username</label>
          <input type="text" name="username" class="form-control" required />
        </div>

        <!-- Password -->
        <div class="mb-3">
          <label class="form-label">Password</label>
          <input type="password" id="password" name="password" class="form-control" required />
          <div class="form-text text-danger" id="strengthError" style="display:none;">
            Password must be at least 8 characters, include uppercase, lowercase, a number, and a special character.
          </div>
        </div>

        <!-- Confirm Password -->
        <div class="mb-3">
          <label class="form-label">Confirm Password</label>
          <input type="password" id="confirmPassword" class="form-control" required />
          <div class="form-text text-danger" id="matchError" style="display:none;">
            Passwords do not match.
          </div>
        </div>

        <!-- Recovery Question -->
        <div class="mb-3">
          <label class="form-label">Recovery Question</label>
          <input type="text" name="recovery_hint" class="form-control" placeholder="E.g. Your birthplace?" required />
        </div>

        <!-- Recovery Answer -->
        <div class="mb-3">
          <label class="form-label">Recovery Answer</label>
          <input type="text" name="recovery_answer" class="form-control" placeholder="Answer to your recovery question" required />
        </div>

        <button type="submit" class="btn btn-success mt-2">Sign Up</button>
      </form>

      <!-- Response Message -->
      <div id="registerMessage" class="mt-4 fw-bold"></div>
    </div>
  </div>

  <!-- Validation + Submit Script -->
  <script>
    function validateForm() {
      const password = document.getElementById('password').value;
      const confirm = document.getElementById('confirmPassword').value;
      const matchError = document.getElementById('matchError');
      const strengthError = document.getElementById('strengthError');
      const strongRegex = /^(?=.*[a-z])(?=.*[A-Z])(?=.*\d)(?=.*[@$!%*?&#^])[A-Za-z\d@$!%*?&#^]{8,}$/;

      if (!strongRegex.test(password)) {
        strengthError.style.display = 'block';
        matchError.style.display = 'none';
        return false;
      }

      if (password !== confirm) {
        matchError.style.display = 'block';
        strengthError.style.display = 'none';
        return false;
      }

      strengthError.style.display = 'none';
      matchError.style.display = 'none';
      return true;
    }

    document.getElementById('registerForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      if (!validateForm()) return;

      const form = e.target;
      const data = {
        username: form.username.value,
        password: form.password.value,
        recovery_hint: form.recovery_hint.value,
        recovery_answer: form.recovery_answer.value
      };

      const res = await fetch('/register', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(data)
      });

      const result = await res.json();
      const msgBox = document.getElementById('registerMessage');

      if (result.success) {
        msgBox.className = 'mt-4 text-success fw-bold';
        msgBox.innerText = '✅ Registration successful! Redirecting to login...';
        setTimeout(() => window.location.href = '/login', 1500);
      } else {
        msgBox.className = 'mt-4 text-danger fw-bold';
        msgBox.innerText = result.message || 'Registration failed. Try again.';
      }
    });
  </script>
</body>
</html>
