<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>User Login</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@500;600&display=swap" rel="stylesheet">
  <style>
    body {
      font-family: 'Inter', sans-serif;
      background-color: #f4f6f8;
    }

    .navbar {
      background-color: #ffffff;
      box-shadow: 0 1px 6px rgba(0, 0, 0, 0.05);
    }

    .navbar-brand {
      font-weight: 600;
      font-size: 1.25rem;
      color: #0d6efd;
    }

    .form-container {
      max-width: 420px;
      margin: 0 auto;
      background-color: #ffffff;
      padding: 40px;
      border-radius: 12px;
      box-shadow: 0 0 30px rgba(0,0,0,0.04);
    }

    h2 {
      text-align: center;
      color: #0d6efd;
      margin-bottom: 30px;
      font-weight: 600;
    }

    .btn-primary {
      width: 100%;
    }

    .forgot-link {
      text-align: center;
    }

    .form-label {
      font-weight: 500;
    }
  </style>
</head>
<body>
  <!-- Navbar -->
  <nav class="navbar navbar-light mb-4">
    <div class="container">
      <a class="navbar-brand" href="/">📝 FeedbackApp</a>
      <div>
        <a class="btn btn-outline-primary me-2" href="/login">Login</a>
        <a class="btn btn-outline-success" href="/register">Register</a>
      </div>
    </div>
  </nav>

  <!-- Login Form -->
  <div class="container">
    <div class="form-container">
      <h2>Login</h2>
      <form action="/login" method="POST">
        <div class="mb-3">
          <label class="form-label">Username</label>
          <input type="text" name="username" class="form-control" required />
        </div>
        <div class="mb-3">
          <label class="form-label">Password</label>
          <input type="password" name="password" class="form-control" required />
        </div>
        <button type="submit" class="btn btn-primary mt-3">Login</button>
      </form>
      <div class="mt-3 forgot-link">
        <a href="/forgot-password" class="text-decoration-none text-primary">Forgot Password?</a>
      </div>
    </div>
  </div>
</body>
</html>
